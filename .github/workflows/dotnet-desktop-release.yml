name: Release selected version

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'preview-v[0-9]+.[0-9]+.[0-9]+'
      - 'preview-v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
  workflow_dispatch:
    inputs:
      channel:
        description: Application to package
        required: true
        type: choice
        options:
          - stable
          - preview
      version:
        description: 'Application version (for example, 3.9.4 or 4.0.0-beta1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:

  release:
    runs-on: windows-latest
    
    env:
      Solution_Name: src\Backup Service Home 3.sln
      Test_Project_Path: src\BSH.Test\BSH.Test.csproj

    steps:
    - name: Set env
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
          $channel = $env:INPUT_CHANNEL
          $version = $env:INPUT_VERSION
        } elseif ($env:REF_NAME -match '^(?<prefix>preview-)?v(?<version>\d+\.\d+\.\d+(?:-beta\d+)?)$') {
          $channel = if ($Matches.prefix) { "preview" } else { "stable" }
          $version = $Matches.version
        } else {
          throw "Unsupported release tag: $env:REF_NAME"
        }

        if ($channel -notin @("stable", "preview") -or
            $version -notmatch '^\d+\.\d+\.\d+(?:\.\d+|-beta\d+)?$') {
          throw "Invalid release channel or version."
        }

        $info_version = $version.replace('-beta', '.')
        echo "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
        echo "BUILD_VERSION=$version" >> $env:GITHUB_ENV
        echo "INFO_VERSION=$info_version" >> $env:GITHUB_ENV
      env:
        REF_NAME: ${{ github.ref_name }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_VERSION: ${{ inputs.version }}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.400
        cache: true
        cache-dependency-path: src/**/packages.lock.json

    - name: Restore dependencies
      run: dotnet restore "Backup Service Home 3.sln" --locked-mode -a x64
      working-directory: ./src

    - name: Install Windows App Runtime for tests
      shell: pwsh
      working-directory: ./src
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        & "..\tools\Install-WindowsAppRuntime.ps1"

    - name: Build and test
      shell: pwsh
      working-directory: ./src
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        dotnet build "Backup Service Home 3.sln" `
          --configuration Release `
          --no-restore `
          -p:Platform=x64

        # Fail the release before packaging if the suite is red.
        dotnet test "$env:Test_Project_Path" `
          --configuration Release `
          --no-build `
          --no-restore `
          -p:Platform=x64 `
          --blame-hang `
          --blame-hang-timeout 2m
      env:
        Test_Project_Path: BSH.Test\BSH.Test.csproj

    - name: Build selected installer
      shell: pwsh
      run: ./build-release-local.ps1 -Channel $env:RELEASE_CHANNEL -BuildVersion $env:BUILD_VERSION -InfoVersion $env:INFO_VERSION -NoRestore
      working-directory: ./src

    - name: Release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $outputDir = "$env:RUNNER_WORKSPACE/bsh3/tools/setup/output"
        $installer = "$outputDir/backupservicehome-${env:BUILD_VERSION}-win64.exe"
        if (-not (Test-Path -LiteralPath $installer)) {
          throw "Selected installer is missing: $installer"
        }
        gh release view "$env:REF_NAME" *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload "$env:REF_NAME" "$installer" --clobber
        } else {
          gh release create "$env:REF_NAME" "$installer" --generate-notes
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_NAME: ${{ github.ref_name }}
        RUNNER_WORKSPACE: ${{ runner.workspace }}
