name: Build pull requests

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'tools/**'
      - '.github/**'

  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: sonarcloud

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: 17
        distribution: 'zulu'

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.400
        cache: true
        cache-dependency-path: src/**/packages.lock.json

    - name: Cache SonarQube packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~\.sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarQube scanner
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .\.sonar\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarQube scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -Path .\.sonar\scanner -ItemType Directory
        dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

    - name: Install coverage tool
      run: dotnet tool install --global dotnet-coverage

    - name: Build and analyze
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        $scanner = Join-Path $env:GITHUB_WORKSPACE ".sonar\scanner\dotnet-sonarscanner"

        Push-Location src
        try {
          & $scanner begin /k:"alexsee_bsh3" /o:"alexsee" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

          dotnet restore "Backup Service Home 3.sln" --locked-mode -a x64

          & "..\tools\Install-WindowsAppRuntime.ps1"

          dotnet build "Backup Service Home 3.sln" `
            --configuration Release `
            --no-restore `
            -p:Platform=x64

          dotnet-coverage collect `
            'dotnet test "Backup Service Home 3.sln" --configuration Release --no-build --no-restore -p:Platform=x64 --blame-hang --blame-hang-timeout 2m' `
            -f xml `
            -o 'coverage.xml'

          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"
        }
        finally {
          Pop-Location
        }
